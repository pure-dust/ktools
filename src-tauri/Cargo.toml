[package]
name = "ktools"
version = "0.1.0"
description = "novel reader by kamilee"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ktools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon", "image-ico", "devtools"] }
tauri-plugin-shell = "2.2.1"
tauri-plugin-single-instance = "2.2.4"
tauri-plugin-fs = "2.3.0"
tauri-plugin-global-shortcut = "2.2.1"
tauri-plugin-dialog = "2.2.2"
tauri-plugin-window-state = "2.2.2"
tauri-plugin-notification = "2.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.11.1"
rdev = "0.5.3"
font-kit = "0.14.3"
once_cell = "1.20.2"
reqwest = { version = "0.13.2", features = ["query"] }
open = "5.3.5"
winapi = { version = "0.3.9", features = ["shellscalingapi"] }
